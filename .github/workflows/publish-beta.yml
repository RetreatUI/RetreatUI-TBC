name: Publish RetreatUI TBC Beta

on:
  push:
    branches: [main]
    paths:
      - "RetreatUI/**"
      - ".github/release-manifest.json"
      - ".github/workflows/publish-beta.yml"
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI/**"
      - ".github/release-manifest.json"
      - ".github/workflows/publish-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreatui-tbc-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and publish TBC beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' .github/release-manifest.json)"
          TITLE="$(jq -r '.title' .github/release-manifest.json)"
          PUBLISH="$(jq -r '.publish' .github/release-manifest.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=RetreatUI_TBC_v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Install Lua 5.1 compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Validate addon
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          test -f RetreatUI/RetreatUI.toc
          grep -q "^## Author: Retreat$" RetreatUI/RetreatUI.toc
          grep -q "^## Version: $VERSION$" RetreatUI/RetreatUI.toc
          for file in Core.lua Profiles.lua WeakAuraData.lua WeakAuras.lua Installer.lua; do
            test -s "RetreatUI/$file"
          done
          ! test -e RetreatUI/DruidRuntime.lua
          grep -q '^WeakAuraData.lua$' RetreatUI/RetreatUI.toc
          ! grep -q '^DruidRuntime.lua$' RetreatUI/RetreatUI.toc
          ! grep -R 'weakAuraPayloads\|WeakAuras.Import' RetreatUI
          grep -q 'type(WeakAuras.Add) == "function"' RetreatUI/WeakAuras.lua
          grep -q 'VerifyDruidHUD' RetreatUI/WeakAuras.lua
          grep -q 'COA_RESOURCE_X, COA_RESOURCE_Y = 0, -152' RetreatUI/WeakAuraData.lua
          grep -q 'COA_MAIN_X, COA_MAIN_Y = 0, -183' RetreatUI/WeakAuraData.lua
          grep -q 'COA_UTILITY_X, COA_UTILITY_Y = 0, -224' RetreatUI/WeakAuraData.lua
          grep -q 'COA_RESOURCE_WIDTH, COA_RESOURCE_HEIGHT = 360, 16' RetreatUI/WeakAuraData.lua
          grep -q 'COA_MAIN_ICON, COA_UTILITY_ICON = 38, 32' RetreatUI/WeakAuraData.lua
          grep -q '33987' RetreatUI/WeakAuraData.lua
          grep -q 'local TOTAL_PAGES = 7' RetreatUI/Installer.lua
          grep -q 'title = "WELCOME"' RetreatUI/Installer.lua
          grep -q 'title = "IMPORT MACROS"' RetreatUI/Installer.lua
          grep -q 'title = "IMPORT ELVUI"' RetreatUI/Installer.lua
          grep -q 'title = "IMPORT WEAKAURAS"' RetreatUI/Installer.lua
          grep -q 'title = "IMPORT DETAILS"' RetreatUI/Installer.lua
          grep -q 'title = "IMPORT DBM"' RetreatUI/Installer.lua
          grep -q 'title = "RELOAD"' RetreatUI/Installer.lua
          ! grep -R "OpenAI\|ChatGPT" RetreatUI

      - name: Package
        shell: bash
        env:
          ASSET: ${{ steps.manifest.outputs.asset }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI dist/package/RetreatUI
          (cd dist/package && zip -r "../$ASSET" RetreatUI)
          test -s "dist/$ASSET"
          zipinfo -1 "dist/$ASSET" | grep -q '^RetreatUI/RetreatUI\.toc$'
          zipinfo -1 "dist/$ASSET" | grep -q '^RetreatUI/WeakAuraData\.lua$'
          ! zipinfo -1 "dist/$ASSET" | grep -q '^RetreatUI/DruidRuntime\.lua$'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.asset }}
          path: dist/${{ steps.manifest.outputs.asset }}
          if-no-files-found: error

      - name: Create or update prerelease
        if: steps.manifest.outputs.publish == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          TITLE: ${{ steps.manifest.outputs.title }}
          ASSET: ${{ steps.manifest.outputs.asset }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          RetreatUI TBC beta 5.

          Includes:
          - Replaces the old single-page installer with a seven-step guided wizard.
          - Installer flow: Welcome → Import Macros → Import ElvUI → Import WeakAuras → Import Details → Import DBM → Reload.
          - ElvUI, WeakAuras and Details are imported individually on their own pages.
          - WeakAuras continues to install and verify the Druid HUD using the exact RetreatUI CoA center-HUD geometry.
          - Macro and DBM pages are already wired for their dedicated modules and clearly report unavailable instead of claiming success when those payloads are not embedded yet.
          - The installer only marks setup complete when the user finishes on the Reload page.

          This remains a testing prerelease.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "dist/$ASSET" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
