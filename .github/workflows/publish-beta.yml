name: Validate and Publish RetreatUI TBC

on:
  push:
    branches: [main]
    paths:
      - "RetreatUI/**"
      - "tests/**"
      - ".github/release-manifest.json"
      - ".github/workflows/publish-beta.yml"
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI/**"
      - "tests/**"
      - ".github/release-manifest.json"
      - ".github/workflows/publish-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreatui-tbc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 zip

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Validate versions and package structure
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' .github/release-manifest.json)"
          TITLE="$(jq -r '.title' .github/release-manifest.json)"
          PUBLISH="$(jq -r '.publish' .github/release-manifest.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          grep -q "^## Author: Retreat$" RetreatUI/RetreatUI.toc
          grep -q "^## Version: $VERSION$" RetreatUI/RetreatUI.toc
          grep -q "RUI.version = \"$VERSION\"" RetreatUI/Core.lua

          python3 - <<'PY'
          from pathlib import Path
          toc = Path('RetreatUI/RetreatUI.toc')
          root = toc.parent
          missing = []
          for raw in toc.read_text(encoding='utf-8-sig').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              candidate = root / line.replace('\\', '/')
              if not candidate.is_file():
                  missing.append(str(candidate))
          if missing:
              raise SystemExit('Missing TOC files: ' + ', '.join(missing))
          PY

          required=(
            Core.lua
            CoAElvUIProfile.lua
            ProfilePayloadPlater1.lua
            ProfilePayloadPlater2.lua
            ProfilePayloadPlater3.lua
            ProfilePayloadPlater4.lua
            ProfilePayloadDetails.lua
            Profiles.lua
            DetailsPersistenceFix.lua
            DetailsSimpleImport.lua
            TBCClassData.lua
            TBCClassHUD.lua
            TBCClassMechanics.lua
            GeneralWeakAuraData.lua
            GeneralPlacementFix.lua
            GeneralSwingTimer.lua
            GeneralSwingPlacement.lua
            WeakAuras.lua
            GeneralWeakAuras.lua
            Macros.lua
            MacroScopeFix.lua
            Installer.lua
            InstallerClassNativeText.lua
          )
          for file in "${required[@]}"; do
            test -s "RetreatUI/$file"
            grep -Fxq "$file" RetreatUI/RetreatUI.toc
          done

          for retired in WeakAuraData.lua ClassWeakAuraData.lua DruidComboPoints.lua RogueComboPoints.lua DruidRuntime.lua; do
            ! test -e "RetreatUI/$retired"
            ! grep -Fxq "$retired" RetreatUI/RetreatUI.toc
          done

          ! grep -R "OpenAI\|ChatGPT" RetreatUI
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"

      - name: Validate class-native HUD runtime
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 tests/validate-class-hud.lua

          grep -Fq 'local COMBO_X, COMBO_Y = 0, -118' RetreatUI/TBCClassHUD.lua
          grep -Fq 'powertype=4' RetreatUI/TBCClassHUD.lua
          grep -Fq 'PLAYER_TOTEM_UPDATE' RetreatUI/TBCClassHUD.lua
          grep -Fq 'GetItemCount(6265)' RetreatUI/TBCClassHUD.lua
          grep -Fq 'Energy Tick' RetreatUI/TBCClassHUD.lua
          grep -Fq 'Five Second Rule' RetreatUI/TBCClassHUD.lua
          grep -Fq 'Stance/Form/Aura' RetreatUI/TBCClassMechanics.lua
          grep -Fq 'MISSING MH POISON' RetreatUI/TBCClassData.lua
          grep -Fq 'MISSING WEAPON IMBUE' RetreatUI/TBCClassData.lua
          grep -Fq 'NO ASPECT' RetreatUI/TBCClassData.lua
          grep -Fq 'Soulstone' RetreatUI/TBCClassData.lua

      - name: Validate General HUD and macro safety
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'local ROOT = "RetreatUI - General"' RetreatUI/GeneralWeakAuraData.lua
          grep -Fq 'GENERAL_PROC_X, GENERAL_PROC_Y = 0, -83' RetreatUI/GeneralWeakAuraData.lua
          grep -Fq 'GENERAL_ICON_SIZE = 30' RetreatUI/GeneralWeakAuraData.lua
          grep -Fq 'GENERAL_ICON_SPACING = 3' RetreatUI/GeneralWeakAuraData.lua
          grep -Fq 'CreateMacro, name, icon, body, true' RetreatUI/MacroScopeFix.lua
          grep -Fq 'FindGeneral' RetreatUI/MacroScopeFix.lua
          grep -Fq 'FindCharacter' RetreatUI/MacroScopeFix.lua
          grep -Fq 'DeleteMacro, generalIndex' RetreatUI/MacroScopeFix.lua
          ! grep -Fq 'EditMacro' RetreatUI/MacroScopeFix.lua

          python3 - <<'PY'
          from pathlib import Path
          lines = [x.strip() for x in Path('RetreatUI/RetreatUI.toc').read_text().splitlines()]
          assert lines.index('Macros.lua') < lines.index('MacroScopeFix.lua') < lines.index('Installer.lua')
          text = Path('RetreatUI/Macros.lua').read_text(encoding='utf-8')
          for cls in ('DRUID','HUNTER','MAGE','PALADIN','PRIEST','ROGUE','SHAMAN','WARLOCK','WARRIOR'):
              assert f'  {cls} = {{' in text, cls
          PY

      - name: Verify embedded profile payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256

          def payload(path):
              text = Path(path).read_text(encoding='utf-8')
              return text.split('[=[', 1)[1].rsplit(']=]', 1)[0]

          plater = ''.join(payload(f'RetreatUI/ProfilePayloadPlater{i}.lua') for i in range(1, 5))
          details = payload('RetreatUI/ProfilePayloadDetails.lua')
          assert len(plater) == 63086
          assert plater.startswith('!PLATER:2!')
          assert sha256(plater.encode()).hexdigest() == 'a89a4a2638d7a911e2579e23545f60d02894dd0ea66e70b6a710e2b9c3700ba8'
          assert len(details) == 10736
          assert details.startswith('D!ProfileV2-')
          assert sha256(details.encode()).hexdigest() == 'a15cfe79ff72272f0f03a0f2118c17fc914a29625d825d1f16f960163fce250b'
          PY

      - name: Package addon
        shell: bash
        run: |
          set -euo pipefail
          ASSET="RetreatUI_TBC_v${VERSION}.zip"
          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI dist/package/RetreatUI
          (cd dist/package && zip -qr "../$ASSET" RetreatUI)
          test -s "dist/$ASSET"
          zipinfo -1 "dist/$ASSET" | grep -Fxq 'RetreatUI/RetreatUI.toc'
          ! zipinfo -1 "dist/$ASSET" | grep -q '^tests/'
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish prerelease
        if: github.event_name != 'pull_request' && env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES=$(cat <<'EOF'
          Class-native TBC HUD overhaul.

          - Rebuilt all 9 TBC class HUDs around dedicated Resources, Main, Utility, Systems and reminder layers.
          - Druid and Rogue now use native WeakAuras combo-point power tracking.
          - Added class mechanics including Shaman totems, Warlock Soul Shards, Druid mana-in-form, energy tick / five-second-rule timing, class reminders and Warrior stance-aware abilities.
          - Existing General trinket/proc tracking remains shared.
          - Macro installation is Character Specific; legacy RetreatUI macros in General are migrated safely while preserving their current body and icon.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
