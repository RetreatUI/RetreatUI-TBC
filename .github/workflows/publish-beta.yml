name: Publish RetreatUI TBC Beta

on:
  push:
    branches: [main]
    paths:
      - "RetreatUI/**"
      - ".github/release-manifest.json"
      - ".github/workflows/publish-beta.yml"
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI/**"
      - ".github/release-manifest.json"
      - ".github/workflows/publish-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreatui-tbc-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and publish TBC beta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' .github/release-manifest.json)"
          TITLE="$(jq -r '.title' .github/release-manifest.json)"
          PUBLISH="$(jq -r '.publish' .github/release-manifest.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=RetreatUI_TBC_v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Install Lua 5.1 compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find RetreatUI -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Validate addon
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail

          test -f RetreatUI/RetreatUI.toc
          grep -q "^## Author: Retreat$" RetreatUI/RetreatUI.toc
          grep -q "^## Version: $VERSION$" RetreatUI/RetreatUI.toc
          grep -q "RUI.version = \"$VERSION\"" RetreatUI/Core.lua

          required_files=(
            Core.lua
            CoAElvUIProfile.lua
            ProfilePayloadPlater1.lua
            ProfilePayloadPlater2.lua
            ProfilePayloadPlater3.lua
            ProfilePayloadPlater4.lua
            ProfilePayloadDetails.lua
            Profiles.lua
            DetailsPersistenceFix.lua
            DetailsSimpleImport.lua
            WeakAuraData.lua
            ClassWeakAuraData.lua
            DruidComboPoints.lua
            RogueComboPoints.lua
            GeneralWeakAuraData.lua
            GeneralPlacementFix.lua
            WeakAuras.lua
            GeneralWeakAuras.lua
            Macros.lua
            Installer.lua
          )

          for file in "${required_files[@]}"; do
            test -s "RetreatUI/$file"
            grep -q "^$file$" RetreatUI/RetreatUI.toc
          done

          ! test -e RetreatUI/DruidRuntime.lua
          ! grep -q '^DruidRuntime.lua$' RetreatUI/RetreatUI.toc
          ! grep -R 'weakAuraPayloads\|WeakAuras.Import' RetreatUI
          ! grep -R "OpenAI\|ChatGPT" RetreatUI

          # Supplied profile exports must stay embedded byte-for-byte.
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256

          def payload(path):
              text = Path(path).read_text(encoding="utf-8")
              return text.split("[=[", 1)[1].rsplit("]=]", 1)[0]

          plater = "".join(payload(f"RetreatUI/ProfilePayloadPlater{i}.lua") for i in range(1, 5))
          details = payload("RetreatUI/ProfilePayloadDetails.lua")

          assert len(plater) == 63086, len(plater)
          assert plater.startswith("!PLATER:2!")
          assert sha256(plater.encode()).hexdigest() == "a89a4a2638d7a911e2579e23545f60d02894dd0ea66e70b6a710e2b9c3700ba8"

          assert len(details) == 10736, len(details)
          assert details.startswith("D!ProfileV2-")
          assert sha256(details.encode()).hexdigest() == "a15cfe79ff72272f0f03a0f2118c17fc914a29625d825d1f16f960163fce250b"
          PY

          # Class HUD geometry stays identical to CoA.
          grep -q 'local function CurrentPackage' RetreatUI/WeakAuras.lua
          grep -q 'function WeakAurasModule:InstallClassHUD' RetreatUI/WeakAuras.lua
          grep -q 'COA_RESOURCE_X, COA_RESOURCE_Y = 0, -152' RetreatUI/WeakAuraData.lua
          grep -q 'COA_MAIN_X, COA_MAIN_Y = 0, -183' RetreatUI/WeakAuraData.lua
          grep -q 'COA_UTILITY_X, COA_UTILITY_Y = 0, -224' RetreatUI/WeakAuraData.lua
          grep -q 'RESOURCE_X, RESOURCE_Y = 0, -152' RetreatUI/ClassWeakAuraData.lua
          grep -q 'MAIN_X, MAIN_Y = 0, -183' RetreatUI/ClassWeakAuraData.lua
          grep -q 'UTILITY_X, UTILITY_Y = 0, -224' RetreatUI/ClassWeakAuraData.lua

          # Druid and Rogue combo points stay in the shared -118 lane.
          grep -q 'COMBO_X, COMBO_Y = 0, -118' RetreatUI/DruidComboPoints.lua
          grep -q 'SEGMENTS = 5' RetreatUI/DruidComboPoints.lua
          grep -q 'COMBO_X, COMBO_Y = 0, -118' RetreatUI/RogueComboPoints.lua
          grep -q 'SEGMENTS = 5' RetreatUI/RogueComboPoints.lua

          # Universal RetreatUI - General category remains at the supplied CoA positions.
          grep -q 'local ROOT = "RetreatUI - General"' RetreatUI/GeneralWeakAuraData.lua
          grep -q 'GENERAL_PROC_X, GENERAL_PROC_Y = 0, -83' RetreatUI/GeneralWeakAuraData.lua
          grep -q 'GENERAL_ICON_SIZE = 30' RetreatUI/GeneralWeakAuraData.lua
          grep -q 'GENERAL_ICON_SPACING = 3' RetreatUI/GeneralWeakAuraData.lua
          grep -q 'TRINKET_FRAME = "ElvUF_Player"' RetreatUI/GeneralPlacementFix.lua
          grep -q 'TRINKET_ANCHOR = "TOPRIGHT"' RetreatUI/GeneralPlacementFix.lua
          grep -q 'TRINKET_SELF = "BOTTOMRIGHT"' RetreatUI/GeneralPlacementFix.lua
          grep -q 'TRINKET_X = -17' RetreatUI/GeneralPlacementFix.lua
          grep -q 'TRINKET_Y = 1' RetreatUI/GeneralPlacementFix.lua

          # Every TBC class must have a Character Specific macro package.
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("RetreatUI/Macros.lua").read_text(encoding="utf-8")
          classes = ["DRUID", "HUNTER", "MAGE", "PALADIN", "PRIEST", "ROGUE", "SHAMAN", "WARLOCK", "WARRIOR"]
          expected = {
              "DRUID": 18,
              "HUNTER": 8,
              "MAGE": 14,
              "PALADIN": 12,
              "PRIEST": 14,
              "ROGUE": 8,
              "SHAMAN": 12,
              "WARLOCK": 8,
              "WARRIOR": 17,
          }

          for index, cls in enumerate(classes):
              start = text.index(f"  {cls} = {{")
              if index + 1 < len(classes):
                  end = text.index(f"  {classes[index + 1]} = {{", start)
              else:
                  end = text.index("\n}\n\nlocal function CurrentClass", start)
              block = text[start:end]
              assert "characterSpecific = true" in block, cls
              count = len(re.findall(r'^\s+(?:Macro|MouseoverMacro|HostileMouseoverMacro)\(', block, re.M))
              assert count == expected[cls], (cls, count, expected[cls])

          assert 'local MACRO_NAME_LIMIT = 16' in text
          assert 'local MACRO_BODY_LIMIT = 255' in text
          assert 'MAX_ACCOUNT_MACROS' in text
          assert 'MAX_CHARACTER_MACROS' in text
          assert 'FindCharacterMacroByName' in text
          assert 'GetMacroIndexByName' not in text
          assert 'pcall(CreateMacro, definition.name, icon, definition.body, 1)' in text
          assert 'pcall(EditMacro, index, definition.name, icon, definition.body, 1)' in text
          assert 'General Macros were not modified.' in text
          PY

          # Druid: preserve DMH macros, healing/dispels and all supplied utility templates.
          grep -q 'recommendedAddon = "DruidMacroHelper"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Powershift"' RetreatUI/Macros.lua
          grep -q '/dmh cd pot supersapper' RetreatUI/Macros.lua
          grep -q '/dmh cd supersapper' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI HealingTouch"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI AbolPoison"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI StarfireCD"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI FeralCharge"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI NSHeal", 17116' RetreatUI/Macros.lua

          # Priest and Shaman must both ship mouseover healing packages.
          grep -q 'MouseoverMacro("RUI FlashHeal"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI GreaterHeal"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI PrayerMend"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI HealingWave"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI LesserHeal"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI ChainHeal"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI EarthShield"' RetreatUI/Macros.lua
          grep -q 'Earth Shock(Rank 1)' RetreatUI/Macros.lua
          grep -q 'castsequence reset=8 Windfury Totem, Grace of Air Totem' RetreatUI/Macros.lua

          # Paladin healing/utility mouseovers and supplied weapon/Hammer of Justice templates.
          grep -q 'MouseoverMacro("RUI HolyLight"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI FlashLight"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI Cleanse"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI HoJ"' RetreatUI/Macros.lua
          grep -q 'name-of-your-Shield' RetreatUI/Macros.lua

          # Hunter supplied templates plus required timing warning.
          grep -q 'Macro("RUI RaptorWeave"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI HunterBurst"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI PetCare"' RetreatUI/Macros.lua
          grep -q 'castsequence reset=2.52 Steady Shot, !Auto Shot' RetreatUI/Macros.lua
          grep -q 'timing is NOT universal' RetreatUI/Macros.lua
          grep -q 'postImportWarning' RetreatUI/Macros.lua
          grep -q '<food>' RetreatUI/Macros.lua

          # Mage supplied CQS/AoE/burst package plus de-curse and Water Elemental controls.
          grep -q 'Macro("RUI Counterspell"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI ABManaPot"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI ArcaneBurst"' RetreatUI/Macros.lua
          grep -q 'MouseoverMacro("RUI Decurse"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI PetFreeze"' RetreatUI/Macros.lua

          # Rogue, Warlock and Warrior high-value class macros.
          grep -q 'Macro("RUI Sinister"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Sap"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Kick"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Felhunter"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI SpellLock"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Charge"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Intervene"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI ShieldWall"' RetreatUI/Macros.lua
          grep -q 'Macro("RUI Interrupt"' RetreatUI/Macros.lua

          # ElvUI layout/class-color invariants.
          grep -q 'ShiftAB = "BOTTOM,ElvUIParent,BOTTOM,-310,32"' RetreatUI/CoAElvUIProfile.lua
          grep -q 'healthclass = true' RetreatUI/CoAElvUIProfile.lua
          grep -q 'local function ApplyPlayerClassColor' RetreatUI/Profiles.lua
          grep -q 'profile.general.valuecolor' RetreatUI/Profiles.lua
          grep -q 'classColor = true' RetreatUI/Profiles.lua

          # Plater Classic import flow and RetreatUI theming.
          grep -q 'local function ImportPlaterClassic' RetreatUI/Profiles.lua
          grep -q 'Plater.DecompressData' RetreatUI/Profiles.lua
          grep -q 'Plater.db.SetProfile' RetreatUI/Profiles.lua
          grep -q 'Plater.db.ResetProfile' RetreatUI/Profiles.lua
          grep -q 'DetailsFramework.table.copy' RetreatUI/Profiles.lua
          ! grep -q 'Plater.ImportProfile' RetreatUI/Profiles.lua
          grep -q 'function Profiles:ApplyPlaterTheme()' RetreatUI/Profiles.lua

          # Details persistence/theme invariants.
          grep -q 'local function ForceDetailsWindowsOpen' RetreatUI/DetailsPersistenceFix.lua
          grep -q 'function Profiles:PrepareDetailsForReload' RetreatUI/DetailsPersistenceFix.lua
          grep -q 'forceOpenOnNextLogin = true' RetreatUI/DetailsPersistenceFix.lua
          grep -q 'details.ImportProfile' RetreatUI/Profiles.lua
          grep -q 'RETREAT_FONT = "Fira Sans Heavy"' RetreatUI/Profiles.lua
          grep -q 'RETREAT_TEXTURE = "ElvUI Norm"' RetreatUI/Profiles.lua

          # Eight-step installer remains unchanged.
          grep -q 'local TOTAL_PAGES = 8' RetreatUI/Installer.lua
          for page in welcome macros elvui plater weakauras details dbm reload; do
            grep -q "id = \"$page\"" RetreatUI/Installer.lua
          done
          grep -q 'ImportPlater' RetreatUI/Installer.lua
          grep -q 'InstallClassHUD' RetreatUI/Installer.lua
          grep -q 'CurrentClassName' RetreatUI/Installer.lua

      - name: Package
        shell: bash
        env:
          ASSET: ${{ steps.manifest.outputs.asset }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package
          cp -a RetreatUI dist/package/RetreatUI
          (cd dist/package && zip -r "../$ASSET" RetreatUI)
          test -s "dist/$ASSET"

          for file in RetreatUI.toc WeakAuraData.lua ClassWeakAuraData.lua DruidComboPoints.lua RogueComboPoints.lua GeneralWeakAuraData.lua GeneralPlacementFix.lua GeneralWeakAuras.lua DetailsPersistenceFix.lua Macros.lua ProfilePayloadDetails.lua ProfilePayloadPlater4.lua; do
            zipinfo -1 "dist/$ASSET" | grep -q "^RetreatUI/$file$"
          done

          ! zipinfo -1 "dist/$ASSET" | grep -q '^RetreatUI/DruidRuntime\.lua$'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.asset }}
          path: dist/${{ steps.manifest.outputs.asset }}
          if-no-files-found: error

      - name: Create or update prerelease
        if: steps.manifest.outputs.publish == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          TITLE: ${{ steps.manifest.outputs.title }}
          ASSET: ${{ steps.manifest.outputs.asset }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          RetreatUI TBC beta 13.

          Includes:
          - Adds Character Specific macro packages for all nine TBC classes.
          - Incorporates the supplied Warrior, Paladin, Druid, Hunter and Mage macro templates.
          - Adds Priest and Shaman mouseover healing/utility macro packages.
          - Adds selected high-value TBC macros for Rogue and Warlock and supplements the other classes with useful class utilities.
          - Hunter receives a post-import warning explaining that the `reset=2.52` Steady Shot template must be adjusted to the player's effective ranged attack speed; the Feed Pet food placeholder is also called out.
          - Adds macro slot/name/body validation and refuses partial installs when there are not enough Character Specific Macro slots.
          - Keeps General Macro slots untouched, preserves the Druid Macro Helper integration, all-class WeakAuras, exact HUD geometry, Plater, Details and ElvUI behavior.

          This remains a testing prerelease.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "dist/$ASSET" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
