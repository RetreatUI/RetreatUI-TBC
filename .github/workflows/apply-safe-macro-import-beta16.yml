name: Apply safe TBC macro import beta16

on:
  push:
    branches:
      - agent/preserve-existing-macros-beta16
    paths:
      - ".github/workflows/apply-safe-macro-import-beta16.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-existing-macros-beta16
      - name: Patch macro importer and beta version
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_safe_macro_import_beta16_v2.py
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI/Macros.lua RetreatUI/Installer.lua RetreatUI/Core.lua RetreatUI/RetreatUI.toc .github/release-manifest.json
          git commit -m "Preserve existing macros on reinstall"
          git push origin HEAD:agent/preserve-existing-macros-beta16
